<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Oihan Gómez — developer from Spain">
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b0f" stop-opacity="0"/><stop offset="1" stop-color="#0b0b0f" stop-opacity=".85"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25252c"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
  <clipPath id="card"><rect width="1280" height="380" rx="22"/></clipPath>
  <style>
    .b1{animation:d1 16s ease-in-out infinite alternate}
    .b2{animation:d2 19s ease-in-out infinite alternate}
    .b3{animation:d3 22s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(160px,60px) scale(1.25)}}
    @keyframes d2{to{transform:translate(-180px,40px) scale(.85)}}
    @keyframes d3{to{transform:translate(120px,-70px) scale(1.2)}}
    .bot{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 50%}
    @keyframes bob{50%{transform:translateY(-10px)}}
    .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1s ease-in-out infinite alternate}
    @keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
    .code{animation:code 6s ease-in-out infinite}
    @keyframes code{0%,100%{opacity:1}50%{opacity:.55}}
    .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    .ant-o{animation:glow 2.4s ease-in-out infinite}
    .ant-g{animation:glow 2.4s ease-in-out 1.2s infinite}
    @keyframes glow{50%{opacity:.25}}
    .line{opacity:0;animation:show 12s infinite}
    .l0{animation-delay:0s}.l1{animation-delay:3s}.l2{animation-delay:6s}.l3{animation-delay:9s}
    @keyframes show{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-6px)}}
    .caret{animation:caret 1s steps(1) infinite}
    @keyframes caret{50%{opacity:0}}
    .in{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
    .in2{animation-delay:.15s}.in3{animation-delay:.3s}.in4{animation-delay:.45s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.line{opacity:0}.l0{opacity:1}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="380" fill="#0b0b0f"/>
  <g filter="url(#blur)" opacity=".75">
    <circle class="b1" cx="260" cy="120" r="170" fill="#c4552d"/>
    <circle class="b2" cx="1000" cy="110" r="170" fill="#12805b"/>
    <circle class="b3" cx="640" cy="380" r="190" fill="#5b3fd6"/>
  </g>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <rect width="1280" height="380" fill="url(#fade)"/>
  <g class="in" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#ffffff" fill-opacity=".7" letter-spacing="2">
    <text x="72" y="92">HI, I'M</text>
  </g>
  <text class="in in2" x="70" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#ffffff" letter-spacing="-1">Oihan Gómez</text>
  <text class="in in3" x="74" y="214" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity=".72">Developer from Spain · <tspan fill="#ffffff" fill-opacity="1" font-weight="700">web, AI, games &amp; music</tspan></text>
  <g class="in in4" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="24" fill="#ffffff">
    <text x="74" y="272" fill="#E8825C">&gt;</text>
    <text class="line l0" x="100" y="272">I build AI tools<tspan class="caret" fill="#3FC79A">▍</tspan></text>
    <text class="line l1" x="100" y="272">I build web platforms<tspan class="caret" fill="#3FC79A">▍</tspan></text>
    <text class="line l2" x="100" y="272">I make games in Unity<tspan class="caret" fill="#3FC79A">▍</tspan></text>
    <text class="line l3" x="100" y="272">I mix and analyze music<tspan class="caret" fill="#3FC79A">▍</tspan></text>
  </g>
  <g class="in in4" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="74" y="306" width="53.8" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/><text x="100.9" y="327" text-anchor="middle" fill="#ffffff" fill-opacity=".85">Web</text><rect x="139.8" y="306" width="96.8" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/><text x="188.20000000000002" y="327" text-anchor="middle" fill="#ffffff" fill-opacity=".85">AI tools</text><rect x="248.6" y="306" width="131.2" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/><text x="314.2" y="327" text-anchor="middle" fill="#ffffff" fill-opacity=".85">Desktop apps</text><rect x="391.79999999999995" y="306" width="71" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/><text x="427.29999999999995" y="327" text-anchor="middle" fill="#ffffff" fill-opacity=".85">Unity</text><rect x="474.79999999999995" y="306" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/><text x="531.8" y="327" text-anchor="middle" fill="#ffffff" fill-opacity=".85">Music tech</text>
  </g>
  <g transform="translate(850 62)">
    <g class="bot">
      <rect width="350" height="260" rx="22" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
      <circle cx="26" cy="26" r="6" fill="#ff5f57"/><circle cx="46" cy="26" r="6" fill="#febc2e"/><circle cx="66" cy="26" r="6" fill="#28c840"/>
      <text x="324" y="31" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#ffffff" fill-opacity=".4">studio.ts</text>
      <rect class="code" x="24" y="62" width="60" height="10" rx="5" fill="#c678dd" fill-opacity="0.85"/><rect class="code" x="92" y="62" width="120" height="10" rx="5" fill="#61afef" fill-opacity="0.85"/><rect class="code" x="24" y="86" width="40" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/><rect class="code" x="72" y="86" width="150" height="10" rx="5" fill="#98c379" fill-opacity="0.85"/><rect class="code" x="40" y="110" width="90" height="10" rx="5" fill="#e5c07b" fill-opacity="0.85"/><rect class="code" x="138" y="110" width="70" height="10" rx="5" fill="#56b6c2" fill-opacity="0.85"/><rect class="code" x="40" y="134" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/><rect class="code" x="24" y="158" width="30" height="10" rx="5" fill="#c678dd" fill-opacity="0.85"/>
      <line x1="24" y1="184" x2="326" y2="184" stroke="#ffffff" stroke-opacity=".08"/>
      <rect class="eq" x="26" y="220" width="8" height="18" rx="3" fill="#E8825C" style="animation-duration:0.70s;animation-delay:-0s"/><rect class="eq" x="39.6" y="183" width="8" height="55" rx="3" fill="#E8825C" style="animation-duration:1.10s;animation-delay:-0.7s"/><rect class="eq" x="53.2" y="190" width="8" height="48" rx="3" fill="#E8825C" style="animation-duration:1.50s;animation-delay:-0.4s"/><rect class="eq" x="66.8" y="197" width="8" height="41" rx="3" fill="#E8825C" style="animation-duration:1.00s;animation-delay:-0.1s"/><rect class="eq" x="80.4" y="204" width="8" height="34" rx="3" fill="#E8825C" style="animation-duration:1.40s;animation-delay:-0.8s"/><rect class="eq" x="94" y="211" width="8" height="27" rx="3" fill="#E8825C" style="animation-duration:0.90s;animation-delay:-0.5s"/><rect class="eq" x="107.6" y="218" width="8" height="20" rx="3" fill="#E8825C" style="animation-duration:1.30s;animation-delay:-0.2s"/><rect class="eq" x="121.2" y="181" width="8" height="57" rx="3" fill="#E8825C" style="animation-duration:0.80s;animation-delay:-0.9s"/><rect class="eq" x="134.8" y="188" width="8" height="50" rx="3" fill="#a988ff" style="animation-duration:1.20s;animation-delay:-0.6s"/><rect class="eq" x="148.39999999999998" y="195" width="8" height="43" rx="3" fill="#a988ff" style="animation-duration:0.70s;animation-delay:-0.3s"/><rect class="eq" x="162" y="202" width="8" height="36" rx="3" fill="#a988ff" style="animation-duration:1.10s;animation-delay:-0s"/><rect class="eq" x="175.6" y="209" width="8" height="29" rx="3" fill="#a988ff" style="animation-duration:1.50s;animation-delay:-0.7s"/><rect class="eq" x="189.2" y="216" width="8" height="22" rx="3" fill="#a988ff" style="animation-duration:1.00s;animation-delay:-0.4s"/><rect class="eq" x="202.79999999999998" y="179" width="8" height="59" rx="3" fill="#a988ff" style="animation-duration:1.40s;animation-delay:-0.1s"/><rect class="eq" x="216.4" y="186" width="8" height="52" rx="3" fill="#a988ff" style="animation-duration:0.90s;animation-delay:-0.8s"/><rect class="eq" x="230" y="193" width="8" height="45" rx="3" fill="#3FC79A" style="animation-duration:1.30s;animation-delay:-0.5s"/><rect class="eq" x="243.6" y="200" width="8" height="38" rx="3" fill="#3FC79A" style="animation-duration:0.80s;animation-delay:-0.2s"/><rect class="eq" x="257.2" y="207" width="8" height="31" rx="3" fill="#3FC79A" style="animation-duration:1.20s;animation-delay:-0.9s"/><rect class="eq" x="270.79999999999995" y="214" width="8" height="24" rx="3" fill="#3FC79A" style="animation-duration:0.70s;animation-delay:-0.6s"/><rect class="eq" x="284.4" y="177" width="8" height="61" rx="3" fill="#3FC79A" style="animation-duration:1.10s;animation-delay:-0.3s"/><rect class="eq" x="298" y="184" width="8" height="54" rx="3" fill="#3FC79A" style="animation-duration:1.50s;animation-delay:-0s"/><rect class="eq" x="311.59999999999997" y="191" width="8" height="47" rx="3" fill="#3FC79A" style="animation-duration:1.00s;animation-delay:-0.7s"/>
    </g>
  </g>
</g>
<rect x="1" y="1" width="1278" height="378" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
</svg>