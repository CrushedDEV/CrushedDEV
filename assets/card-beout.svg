  <text x="28" y="116" font-size="16" fill="#ffffff" fill-opacity=".68">Club management platform for a VRChat community:</text><text x="28" y="139" font-size="16" fill="#ffffff" fill-opacity=".68">events, staff and community activities.</text>
  <g font-size="12.5" font-weight="600"><rect x="28" y="196" width="44.2" height="26" rx="13" fill="#6ea2ff" fill-opacity=".14" stroke="#6ea2ff" stroke-opacity=".35"/><text x="50.1" y="213.5" text-anchor="middle" fill="#6ea2ff">Web</text><rect x="80.2" y="196" width="66.4" height="26" rx="13" fill="#6ea2ff" fill-opacity=".14" stroke="#6ea2ff" stroke-opacity=".35"/><text x="113.4" y="213.5" text-anchor="middle" fill="#6ea2ff">Docker</text><rect x="154.60000000000002" y="196" width="66.4" height="26" rx="13" fill="#6ea2ff" fill-opacity=".14" stroke="#6ea2ff" stroke-opacity=".35"/><text x="187.8" y="213.5" text-anchor="middle" fill="#6ea2ff">Events</text></g>
  <text x="592" y="61" text-anchor="end" font-size="20" fill="#ffffff" fill-opacity=".45">↗</text>
