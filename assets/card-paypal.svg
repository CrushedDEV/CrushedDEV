<svg xmlns="http://www.w3.org/2000/svg" width="620" height="250" viewBox="0 0 620 250" role="img" aria-label="PayPal for Laravel: Integrates PayPal payments through the REST API: orders, captures and sandbox support.">
<defs>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientTransform="translate(0 0) scale(520 260)"><stop offset="0" stop-color="#f0b44c" stop-opacity=".22"/><stop offset="1" stop-color="#f0b44c" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="620" height="250" rx="18"/></clipPath>
  <style>.sh{animation:sh 7s ease-in-out infinite}@keyframes sh{0%,70%{transform:translateX(-700px)}100%{transform:translateX(700px)}}@media (prefers-reduced-motion: reduce){.sh{animation:none;opacity:0}}</style>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="620" height="250" fill="#111116"/>
  <rect width="620" height="250" fill="url(#g)"/>
  <rect class="sh" x="0" y="-50" width="260" height="350" fill="url(#shine)" transform="skewX(-20)"/>
  <rect width="620" height="4" fill="#f0b44c"/>
</g>
<rect x="1" y="1" width="618" height="248" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="2"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <rect x="28" y="30" width="46" height="46" rx="12" fill="#f0b44c" fill-opacity=".16" stroke="#f0b44c" stroke-opacity=".4"/>
  <text x="51" y="61" text-anchor="middle" font-size="22" font-weight="700" fill="#f0b44c" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace">$</text>
  <text x="90" y="52" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#f0b44c">LARAVEL PACKAGE</text>
  <text x="90" y="76" font-size="25" font-weight="700" fill="#ffffff">PayPal for Laravel</text>
  <text x="28" y="116" font-size="16" fill="#ffffff" fill-opacity=".68">Integrates PayPal payments through the REST API:</text><text x="28" y="139" font-size="16" fill="#ffffff" fill-opacity=".68">orders, captures and sandbox support.</text>
  <g font-size="12.5" font-weight="600"><rect x="28" y="196" width="44.2" height="26" rx="13" fill="#f0b44c" fill-opacity=".14" stroke="#f0b44c" stroke-opacity=".35"/><text x="50.1" y="213.5" text-anchor="middle" fill="#f0b44c">PHP</text><rect x="80.2" y="196" width="73.80000000000001" height="26" rx="13" fill="#f0b44c" fill-opacity=".14" stroke="#f0b44c" stroke-opacity=".35"/><text x="117.10000000000001" y="213.5" text-anchor="middle" fill="#f0b44c">Laravel</text><rect x="162" y="196" width="81.2" height="26" rx="13" fill="#f0b44c" fill-opacity=".14" stroke="#f0b44c" stroke-opacity=".35"/><text x="202.6" y="213.5" text-anchor="middle" fill="#f0b44c">Payments</text></g>
  <text x="592" y="61" text-anchor="end" font-size="20" fill="#ffffff" fill-opacity=".45">↗</text>
</g>
</svg>